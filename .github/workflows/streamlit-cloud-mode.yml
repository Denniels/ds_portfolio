name: Streamlit Cloud Development Mode

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Show Deployment Mode
        run: |
          echo "🚀 MODO DE DESPLIEGUE ACTIVO: STREAMLIT CLOUD"
          echo "================================================"
          echo "✅ Este proyecto se despliega en Streamlit Cloud"
          echo "❌ El despliegue en GCP está desactivado"
          echo "📝 Para ver la app: https://share.streamlit.io"
          
      - name: Verify Streamlit Cloud Configuration
        run: |
          if [ -f ".streamlit/config.toml" ]; then
            echo "✅ Configuración de Streamlit detectada"
          else
            echo "⚠️ Falta archivo de configuración de Streamlit"
          fi
          
          if [ -f "requirements.txt" ]; then
            echo "✅ Requirements.txt detectado"
          else
            echo "⚠️ Falta archivo requirements.txt"
          fi
