[build-system]
requires = ["setuptools>=69.0.0", "wheel>=0.42.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ds_portfolio"
version = "1.0.0"
description = "Portfolio de Ciencia de Datos"
requires-python = ">=3.9,<3.10"
dependencies = [
    "streamlit>=1.28.0,<2.0.0",
    "numpy>=1.24.0,<2.0.0",
    "pandas>=2.0.0,<3.0.0",
]

[tool.setuptools]
py-modules = []
