[streamlit]
# Secretos para la configuración de Streamlit Cloud
environment = "cloud"
enableStaticServing = true
optimizeRendering = true
maxCachedMessageAge = 300
renderOnScroll = true
aggressiveCaching = true

[contact]
email = "ds.portfolio.chile@gmail.com"
linkedin = "https://www.linkedin.com/in/daniel-andres-mardones-sanhueza-27b73777"
github = "https://github.com/Denniels"

[app]
# Configuración específica de la aplicación
name = "Portfolio Data Science Chile"
version = "2.0.0"
update_date = "Junio 2025"
enableErrorHandling = true
maxRetries = 3
loadTimeout = 30000

[performance]
# Optimizaciones de rendimiento
useArrowFormat = true
cacheTimeout = 3600
maxConcurrentConnections = 5
enableProgressiveRendering = true
batchSize = 1000
