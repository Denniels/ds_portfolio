[server]
# Configuración optimizada para Streamlit Cloud
headless = true
maxUploadSize = 50

[browser]
gatherUsageStats = false

[theme]
# Tema personalizado para la aplicación
primaryColor = "#3B82F6"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#f8f9fa"
textColor = "#1F2937"
font = "sans serif"

[logger]
level = "warning"

# Configuración global - opciones obsoletas removidas
